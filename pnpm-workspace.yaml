# Single-package repo, but pnpm 11 reads its settings only from this file --
# the `pnpm` field in package.json is ignored.

# @pierre/diffs accepts shiki ^3 || ^4; pin the version Pierre actually ships
# and tests diffshub against so tokenization behaviour matches upstream.
overrides:
  shiki: '4.4.3'
  '@shikijs/core': '4.4.3'
  '@shikijs/engine-javascript': '4.4.3'
  '@shikijs/themes': '4.4.3'
  '@shikijs/transformers': '4.4.3'

# @pierre/trees@1.0.0-beta.6 pins @pierre/theming@1.0.0 while @pierre/diffs
# pins 1.0.1, which installs two copies. Both hold resolved-theme state at
# module scope, so collapse them onto one so the tree and diff surfaces share
# it. Patch-level, so the pin is safe.
  '@pierre/theming': '1.0.1'

# Tailwind 4 needs its native oxide binary built.
allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true

# Refuse any release younger than 7 days (the value is in minutes). The window
# right after publish is when a hijacked version is live and not yet caught, so
# nothing enters the tree until it has been public a while. Upstream pierre
# runs the same threshold.
#
# This genuinely bites, which is the point: it is why next is on 16.3.0 rather
# than 16.3.1, postcss-import on 16.2.0 rather than 17.0.0, and
# @hugeicons/core-free-icons on 4.2.3 rather than 4.3.0. It also pins
# read-cache to 1.0.0 (2016) rather than the 1.0.1/1.0.2 that both appeared on
# 2026-08-19 after ten years of silence -- exactly the shape this guards
# against. Raise a version once it ages past the floor; do not add an exclude.
minimumReleaseAge: 10080

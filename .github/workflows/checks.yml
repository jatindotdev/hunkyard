name: Checks

# Called by ci.yml on every push, and by release.yml as a dependency of
# publishing, so the checks have one definition rather than two that drift.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than latest: the binary embeds this runtime, so a
          # toolchain bump is a change to what ships and should be deliberate.
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Before the tests, because the browser ones serve the built client. One
      # ordering beats splitting the suite around it.
      - name: Build
        run: bun run build

      # The git layer's tests run against real repositories they create in a temp
      # directory, configuring their own identity, so git is all they need. The
      # browser ones drive real Chrome, which is the only place shadow DOM, a
      # virtualized surface with real layout, the highlight worker pool and key
      # events can be checked together. CI=true makes a missing Chrome a failure
      # rather than a silent skip, so this cannot quietly stop covering the UI.
      - name: Test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun test

      # A binary that compiles but cannot serve is the failure worth catching
      # here, and it is not something the unit tests can see.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          test "$(./dist/hunk --version)" = "$(bun -e 'console.log(require("./package.json").version)')"

          repo="$(mktemp -d)"
          git -C "$repo" init -q
          git -C "$repo" config user.email ci@example.com
          git -C "$repo" config user.name CI
          printf 'export const a = 1;\n' > "$repo/a.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -qm initial
          printf 'export const a = 1;\nexport const b = 2;\n' > "$repo/a.ts"

          ( cd "$repo" && "$GITHUB_WORKSPACE/dist/hunk" --no-open --port 4865 )

          curl -fsS http://127.0.0.1:4865/api/health | tee /dev/stderr | grep -q '"app":"hunkyard"'
          # The client is embedded, so serving it proves --asset worked.
          curl -fsS http://127.0.0.1:4865/ | grep -qi '<title>'
          repo_id="$(curl -fsS http://127.0.0.1:4865/api/repos | grep -oE '"id":"[^"]+"' | head -1 | cut -d'"' -f4)"
          curl -fsS "http://127.0.0.1:4865/api/local-diff?repo=$repo_id" | grep -q '^+export const b'

          "$GITHUB_WORKSPACE/dist/hunk" stop --port 4865

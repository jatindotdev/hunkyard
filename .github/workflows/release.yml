name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Creating the release and uploading its assets.
  contents: write

jobs:
  # Depended on rather than repeated. The checks live in one workflow that CI
  # also calls, so the release cannot drift from what CI verifies, and nothing
  # gets published from a commit that failed them.
  check:
    uses: ./.github/workflows/checks.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}
          # Full history so --verify-tag can check the tag's signature.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      # Before building, because a tag with no notes should fail in seconds
      # rather than after every target has been cross-compiled.
      - name: Compose the release notes
        run: bun scripts/releaseNotes.ts "${{ steps.tag.outputs.name }}" > /tmp/notes.md

      - name: Refuse a tag that disagrees with package.json
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package.json version $version." >&2
            exit 1
          fi

      # The cross-compile embeds the client, so it has to exist first.
      - name: Build the client
        run: bun run build:client

      # Every target is cross-compiled here, once. bun build --compile is not
      # reproducible, so SHA256SUMS is only valid for these artifacts, and
      # splitting the build across jobs would describe files nobody has.
      - name: Cross-compile every target
        run: bun scripts/release.ts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/hunk-* dist/release/git-hunk.1 \
              dist/release/SHA256SUMS --clobber
            # Re-running a release should correct its notes too.
            gh release edit "$tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" \
              --title "hunkyard $tag" \
              --notes-file /tmp/notes.md \
              --verify-tag \
              dist/release/hunk-* dist/release/git-hunk.1 dist/release/SHA256SUMS
          fi

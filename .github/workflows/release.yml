name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Creating the release and uploading its assets.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.name }}
          # Full history so --verify-tag can check the tag's signature.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Refuse a tag that disagrees with package.json
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package.json version $version." >&2
            exit 1
          fi

      - name: Test
        run: bun test

      # Everything is built here, once. bun build --compile is not
      # reproducible, so SHA256SUMS is only valid for these artifacts, and
      # splitting the build across jobs would describe files nobody has.
      - name: Build every target
        run: bun run build:release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/hunk-* dist/release/git-hunk.1 \
              dist/release/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --title "hunkyard $tag" \
              --generate-notes \
              --verify-tag \
              dist/release/hunk-* dist/release/git-hunk.1 dist/release/SHA256SUMS
          fi

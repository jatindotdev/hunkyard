name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless, except on main where every
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than latest: the binary embeds this runtime, so a
          # toolchain bump is a change to what ships and should be deliberate.
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The git layer's tests run against real repositories they create in a
      # temp directory, configuring their own identity, so git is all they need.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # A binary that compiles but cannot serve is the failure worth catching
      # here, and it is not something the unit tests can see.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          test "$(./dist/hunk --version)" = "$(bun -e 'console.log(require("./package.json").version)')"

          repo="$(mktemp -d)"
          git -C "$repo" init -q
          git -C "$repo" config user.email ci@example.com
          git -C "$repo" config user.name CI
          printf 'export const a = 1;\n' > "$repo/a.ts"
          git -C "$repo" add -A
          git -C "$repo" commit -qm initial
          printf 'export const a = 1;\nexport const b = 2;\n' > "$repo/a.ts"

          ( cd "$repo" && "$GITHUB_WORKSPACE/dist/hunk" --no-open --port 4865 )

          curl -fsS http://127.0.0.1:4865/api/health | tee /dev/stderr | grep -q '"app":"hunkyard"'
          # The client is embedded, so serving it proves --asset worked.
          curl -fsS http://127.0.0.1:4865/ | grep -qi '<title>'
          repo_id="$(curl -fsS http://127.0.0.1:4865/api/repos | grep -oE '"id":"[^"]+"' | head -1 | cut -d'"' -f4)"
          curl -fsS "http://127.0.0.1:4865/api/local-diff?repo=$repo_id" | grep -q '^+export const b'

          "$GITHUB_WORKSPACE/dist/hunk" stop --port 4865
